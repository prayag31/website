apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: website
  template:
    metadata:
      labels:
        app: website
    spec:
      containers:
        - name: website
          image: prayag31/website:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
